# Nginx site config for aryannaveen.com
# Copy to /etc/nginx/sites-available/resume and symlink into sites-enabled,
# then run certbot (see the comments at the bottom) to add HTTPS.

# www.aryannaveen.com -> aryannaveen.com, so Google sees one version of the site.
server {
    listen 80;
    listen [::]:80;
    server_name www.aryannaveen.com;
    return 301 https://aryannaveen.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name aryannaveen.com;

    root /var/www/resume;
    index index.html;
    error_page 404 /404.html;

    # Let's Encrypt renewals. ^~ wins over the dotfile rule below.
    location ^~ /.well-known/acme-challenge/ { allow all; }

    # The site is served straight from the git checkout, so never expose
    # .git, .github or any other dotfile, the deploy and tools folders, or docs.
    location ~ /\.        { deny all; return 404; }
    location ^~ /deploy/   { deny all; return 404; }
    location ^~ /tools/    { deny all; return 404; }
    location ~* \.(md|py)$ { deny all; return 404; }

    # Clean URLs: /projects/ serves projects/index.html (and /projects redirects to /projects/).
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets; HTML is always revalidated so deploys show immediately.
    # (expires, not add_header, so the security headers below are inherited.)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
    }
    location ~* \.(html|xml|txt)$ {
        expires -1;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}

# HTTPS: after copying this file and reloading Nginx, run
#   sudo certbot --nginx -d aryannaveen.com -d www.aryannaveen.com
# If a certificate already exists, choose "Attempt to reinstall this existing certificate".
# Certbot adds the 443 listeners and the HTTP -> HTTPS redirect to the copy on the server.
