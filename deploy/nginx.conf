# Nginx site config for the resume site.
# Copy to /etc/nginx/sites-available/resume and symlink into sites-enabled.
# Replace example.com with your domain (or use _ to match the bare EC2 IP).

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/resume;
    index index.html;

    # The site is served straight from the git checkout, so never expose
    # .git, .github or any other dotfile, or the deploy folder.
    location ~ /\.      { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }
    location ~* \.md$    { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets; HTML is always revalidated so deploys show immediately.
    # (expires, not add_header, so the security headers below are inherited.)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
    }
    location ~* \.html$ {
        expires -1;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
